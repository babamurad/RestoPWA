[program:restopwa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/restopwa.tmtourism.com/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/restopwa.tmtourism.com/storage/logs/worker.log
stopwaitsecs=3600
