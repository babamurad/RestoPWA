; Supervisor programs for RestoPWA production.
; Copy to /etc/supervisor/conf.d/restopwa.conf, replace /var/www/restopwa and
; www-data with your app path and web-server user, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status

; Queue workers: "high" (courier offers, 30 s deadline) is always taken before "default"
; (push, SMS). --max-time restarts workers hourly so they pick up memory/code changes.
[program:restopwa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/restopwa/artisan queue:work database --queue=high,default --sleep=1 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/restopwa
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/restopwa/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Realtime websockets (Laravel Reverb): needed when BROADCAST_CONNECTION=reverb
[program:restopwa-reverb]
command=php /var/www/restopwa/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/restopwa
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/restopwa/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
