[program:restopwa-reverb]
command=php /var/www/restopwa.tmtourism.com/artisan reverb:start --host=0.0.0.0 --port=8081
directory=/var/www/restopwa.tmtourism.com
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/restopwa.tmtourism.com/storage/logs/reverb.log
