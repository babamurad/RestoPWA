name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Most existing files predate Pint, so only files changed
      # relative to the base branch are checked.
      - name: Pint (changed files)
        if: github.event_name == 'pull_request'
        run: vendor/bin/pint --test --diff=origin/${{ github.base_ref }}

      - name: PHPUnit
        run: php artisan test

  # Production runs on PostgreSQL with PostGIS: the same tests against the real database
  # catch what SQLite forgives (strict uuid columns, geo queries, SQL dialect differences).
  backend-postgres:
    name: Backend (PHPUnit on PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: restopwa
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: restopwa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restopwa -d restopwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Set here, so phpunit.xml (sqlite in memory) does not override them
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: restopwa_test
      DB_USERNAME: restopwa
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, intl, bcmath, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # The browser tests of the customer app, the courier screen and the panels (Laravel Dusk).
  # They run against a real server with the production build of the front end.
  e2e:
    name: E2E (Dusk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/dusk.sqlite

      - name: Build the front end
        run: npm run build

      # The driver must match the Chrome of the runner
      - name: ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start the app
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8001 --env=dusk.local > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/up > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Dusk
        env:
          DUSK_NO_SANDBOX: '1'
        run: php artisan dusk

      - name: Screenshots and logs of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-failure
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
            server.log
          if-no-files-found: ignore
